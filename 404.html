<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dance With Dixon</title>
  <style>
    body {
      background: #0c1f17;
      color: #FAF3E8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    .content {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 1rem 0;
    }
    p {
      font-size: 1.125rem;
      margin: 0;
    }
  </style>
  <script>
    // GitHub Pages SPA redirect — preserves hash routing
    // Works with both custom domain and /dwd-website repo path
    var path = window.location.pathname;
    var repo = '/dwd-website';
    if (path.startsWith(repo)) {
      window.location.replace(repo + '/#home');
    } else {
      window.location.replace('/#home');
    }
  </script>
</head>
<body>
  <div class="content">
    <h1>Page not found.</h1>
    <p>Heading home.</p>
  </div>
</body>
</html>
