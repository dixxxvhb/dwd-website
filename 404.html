<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1f17">
  <meta name="robots" content="noindex">
  <title>Not found · Dance With Dixon</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logos/v3/DWD-glyph-dark-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/logos/v3/DWD-compact-dark-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #0c1f17; }
    .nf-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 3rem 1.5rem;
      text-align: center;
      color: #faf3e8;
      font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .nf-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #faf3e8;
    }
    .nf-brand span {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.125rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(250, 243, 232, 0.82);
    }
    .nf-brand em { font-style: italic; }
    .nf-page h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.5rem, 9vw, 4rem);
      line-height: 1.05;
      margin: 0;
    }
    .nf-page p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.55;
      color: rgba(250, 243, 232, 0.72);
    }
    .nf-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 2rem;
    }
    .nf-links a {
      color: #faf3e8;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 122, 162, 0.7);
      font-size: 0.9375rem;
      letter-spacing: 0.06em;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .nf-links a:hover, .nf-links a:focus-visible { border-bottom-color: #ff7aa2; color: #ff7aa2; }
    /* Tamara Mark, same markup and weight as the site footer's. */
    .tamara-mark { display: block; opacity: 0.9; }
    @media (min-resolution: 2dppx) { /* fine lines on 2x/3x, as in site.css */
      .tamara-mark circle:nth-of-type(1) { stroke-width: 0.6; }
      .tamara-mark circle:nth-of-type(2) { stroke-width: 0.85; }
    }
  </style>
</head>
<body data-arm="house">
  <main class="nf-page">
    <a class="nf-brand" href="/">
      <span>Dance <em>With</em> Dixon</span>
    </a>
    <h1>Nothing here.</h1>
    <p>That page moved or never existed.</p>
    <nav class="nf-links" aria-label="Where to go next">
      <a href="/">Home</a>
      <a href="/schedule/">This week&rsquo;s classes</a>
      <a href="/proseries/">ProSeries</a>
      <a href="/contact/">Contact</a>
    </nav>
    <!-- Tamara Mark — For Mom -->
    <svg class="tamara-mark tamara-mark--footer" viewBox="20 10 200 190" width="28" height="27" aria-hidden="true">
      <circle cx="100" cy="115" r="65" fill="none" stroke="url(#tm-gold-f)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linecap="round" opacity="0.75"/>
      <circle cx="152" cy="70" r="49" fill="none" stroke="url(#tm-gold-f)" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linecap="round" opacity="0.95"/>
      <circle cx="107" cy="50" r="10" fill="url(#tm-glow-f)" opacity="0.25"/>
      <defs>
        <linearGradient id="tm-gold-f" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c9956c"/><stop offset="40%" stop-color="#e8c49a"/><stop offset="100%" stop-color="#d4a574"/>
        </linearGradient>
        <radialGradient id="tm-glow-f"><stop offset="0%" stop-color="#e8c49a"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      </defs>
    </svg>
  </main>
</body>
</html>
